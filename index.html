
<!DOCTYPE html>

<head>

  <title>Kenzy Ahmed</title>

  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }

    .card {
      background: #1e293b;
      margin: 20px;
      padding: 30px;
      border-radius: 20px;
    }

    h1, h2 {
      color: gold;
    }

    .profile {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid gold;
      margin-bottom: 20px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .skills {
      background: #111;
      color: white;
      padding: 25px;
      margin: 20px auto;
      border: 2px solid gold;
      border-radius: 15px;
      max-width: 500px;
      text-align: center;
    }

    .skills p {
      background: #222;
      padding: 10px;
      border-radius: 8px;
      margin: 8px 0;
    }

    button, summary, .social-links a {
      background: linear-gradient(135deg, #ffd700, #b8860b);
      color: #111;
      padding: 12px 25px;
      border-radius: 30px;
      border: 2px solid gold;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      display: inline-block;
      margin: 8px;
      transition: 0.3s;
    }

    button:hover, summary:hover, .social-links a:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px gold;
    }

    .social-links {
      margin-top: 10px;
    }
  </style>
</head>

        target="_blank">

        </a>
